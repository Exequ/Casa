# Comprobaciones de cada pull request y de cada cambio en main:
# tipos de TypeScript, tests y compilación.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Tipos y compilación
        run: npm run build
